<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ── -->
    <title>Atlas - DSA & CP Problem Tracker | 14,500+ Problems</title>
    <meta name="description" content="Browse 14,500+ LeetCode, Codeforces and CSES problems with AI explanations, JavaScript solutions, and an 8-level DSA roadmap. Free progress tracking." />
    <meta name="keywords" content="DSA problems, competitive programming tracker, LeetCode alternative, DSA roadmap, algorithm solutions JavaScript, CSES problems, Codeforces tracker, coding interview prep" />
    <meta name="author" content="Atlas" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://atlas-cp.vercel.app/" />

    <!-- ── Open Graph ── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Atlas" />
    <meta property="og:url"         content="https://atlas-cp.vercel.app/" />
    <meta property="og:title"       content="Atlas - DSA & CP Problem Tracker | 14,500+ Problems" />
    <meta property="og:description" content="Browse 14,500+ LeetCode, Codeforces and CSES problems with AI explanations, JavaScript solutions, and an 8-level DSA roadmap. Free progress tracking." />
    <meta property="og:image"       content="https://atlas-cp.vercel.app/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="Atlas - DSA & CP Problem Tracker" />
    <meta property="og:locale"      content="en_US" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@atlas_cp" />
    <meta name="twitter:title"       content="Atlas - DSA & CP Problem Tracker" />
    <meta name="twitter:description" content="14,500+ problems. AI explanations. JS solutions. 8-level roadmap. Free." />
    <meta name="twitter:image"       content="https://atlas-cp.vercel.app/og-image.png" />
    <meta name="twitter:image:alt"   content="Atlas - DSA & CP Problem Tracker" />

    <!-- ── Favicon & App Icons ── -->
    <link rel="icon"             type="image/svg+xml"  href="/favicon.svg" />
    <link rel="icon"             type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon"             type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180"   href="/apple-touch-icon.png" />
    <link rel="manifest"                            href="/site.webmanifest" />
    <meta name="theme-color"    content="#7c3aed" />
    <meta name="msapplication-TileColor" content="#7c3aed" />

    <!-- ── Performance: preconnect to font origins ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Performance: preload critical font ── -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />

    <!-- ── Sitemap reference ── -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- ── JSON-LD: WebSite (static baseline - useSEO hook overrides per page) ── -->
    <script type="application/ld+json" id="atlas-jsonld">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Atlas",
      "url": "https://atlas-cp.vercel.app",
      "description": "Browse 14,500+ LeetCode, Codeforces and CSES problems with AI explanations, JavaScript solutions, and an 8-level DSA roadmap.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://atlas-cp.vercel.app/problems?search={query}"
        },
        "query-input": "required name=query"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
